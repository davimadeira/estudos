<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ekklesia Study | Plataforma Teológica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- MODAL DE LOGIN POR E-MAIL -->
<div id="emailLoginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Entrar com E-mail</h3>
            <button class="close-modal">&times;</button>
        </div>
        <div class="modal-body">
            <input type="email" id="loginEmail" placeholder="seu@email.com">
            <input type="password" id="loginPassword" placeholder="Senha">
            <button id="submitLoginBtn" class="btn-primary">Entrar</button>
            <div class="divider">ou</div>
            <button id="showRegisterBtn" class="btn-outline">Criar nova conta</button>
        </div>
    </div>
</div>

<!-- MODAL DE CADASTRO -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Criar Conta</h3>
            <button class="close-modal">&times;</button>
        </div>
        <div class="modal-body">
            <input type="text" id="registerName" placeholder="Nome completo">
            <input type="email" id="registerEmail" placeholder="E-mail">
            <input type="password" id="registerPassword" placeholder="Senha (min 8 caracteres)">
            <input type="password" id="registerConfirmPassword" placeholder="Confirmar senha">
            <button id="submitRegisterBtn" class="btn-primary">Cadastrar</button>
        </div>
    </div>
</div>

<!-- APP PRINCIPAL -->
<div id="appContainer" class="app-container" style="display: none;">
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-church"></i>
            <span>Ekklesia<br><small>Study</small></span>
        </div>
        <nav class="nav-menu">
            <div class="nav-item active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></div>
            <div class="nav-item" data-page="cronograma"><i class="fas fa-calendar-alt"></i><span>Cronograma</span></div>
            <div class="nav-item" data-page="conteudo"><i class="fas fa-book-open"></i><span>Conteúdo</span></div>
            <div class="nav-item" data-page="questoes"><i class="fas fa-question-circle"></i><span>Questões</span></div>
            <div class="nav-item" data-page="redacao"><i class="fas fa-pen-fancy"></i><span>Redação</span></div>
            <div class="nav-item" data-page="estatisticas"><i class="fas fa-chart-line"></i><span>Estatísticas</span></div>
        </nav>
        <div class="user-info-sidebar">
            <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
            <div class="user-details">
                <span id="sidebarUserName">Carregando...</span>
                <button id="logoutBtn" class="btn-logout">Sair</button>
            </div>
        </div>
    </aside>
    <main class="main-content">
        <header class="top-header">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="header-actions">
                <button id="themeToggle" class="icon-btn"><i class="fas fa-moon"></i></button>
                <div class="user-greeting">
                    <i class="fas fa-smile-wink"></i>
                    <span id="userGreeting">Olá, Visitante</span>
                </div>
            </div>
        </header>
        <div class="content-area" id="contentArea"></div>
    </main>
</div>

</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
